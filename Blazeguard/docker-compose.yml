version: '3.8'

services:
  # ---------------------------------------------------------
  # Message Broker: Kafka and Zookeeper
  # ---------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: blazeguard-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - blazeguard-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: blazeguard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - blazeguard-net

  # ---------------------------------------------------------
  # Control Plane & Routing
  # ---------------------------------------------------------
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: blazeguard-orchestrator
    ports:
      - "8090:8090"
      - "9090:9090"
    environment:
      ORCHESTRATOR_PORT: "8090"
      ORCHESTRATOR_GRPC_PORT: "9090"
      REDIS_URL: ${REDIS_URL}
    networks:
      - blazeguard-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: blazeguard-api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      KAFKA_BROKER: kafka:29092
      ML_MODEL_URL: http://ml-model:9000
    depends_on:
      - kafka
    networks:
      - blazeguard-net

  # ---------------------------------------------------------
  # Python Machine Learning Service
  # ---------------------------------------------------------
  ml-model:
    build:
      context: ./ml-model
      dockerfile: Dockerfile
    container_name: blazeguard-ml-model
    ports:
      - "9000:9000"
    environment:
      ML_MODEL_HOST: "0.0.0.0"
      ML_MODEL_PORT: "9000"
    networks:
      - blazeguard-net

  # ---------------------------------------------------------
  # Backend Services: Auth
  # ---------------------------------------------------------
  auth-service:
    build:
      context: ./Backend/Auth
      dockerfile: Dockerfile
    container_name: blazeguard-auth-service
    ports:
      - "2000:2000"
    environment:
      PORT: "2000"
      DATABASE_URL: ${DATABASE_URL}
      DB_SSLMODE: ${DB_SSLMODE}
      FRONTEND_URL: http://localhost:5173
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_NAME: ${SESSION_NAME}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
    networks:
      - blazeguard-net

  # ---------------------------------------------------------
  # Go Microservice Agents (A2A)
  # ---------------------------------------------------------
  detection-agent:
    build:
      context: ./A2A
      dockerfile: agent/detection/Dockerfile
    container_name: blazeguard-detection-agent
    ports:
      - "8001:8001"
    environment:
      KAFKA_BROKER: kafka:29092
      EVENT_VERSION: v1
      DETECTION_AGENT_URL: http://detection-agent:8001
      ORCHESTRATOR_PORT: "8090"
      ORCHESTRATOR_GRPC_PORT: "9090"
    depends_on:
      - kafka
      - orchestrator
    networks:
      - blazeguard-net

  prediction-agent:
    build:
      context: ./A2A
      dockerfile: agent/prediction/Dockerfile
    container_name: blazeguard-prediction-agent
    ports:
      - "8002:8002"
    environment:
      KAFKA_BROKER: kafka:29092
      EVENT_VERSION: v1
      PREDICTION_AGENT_URL: http://prediction-agent:8002
      ORCHESTRATOR_PORT: "8090"
      ORCHESTRATOR_GRPC_PORT: "9090"
      ML_MODEL_URL: http://ml-model:9000
      WEATHER_API_KEY: ${WEATHER_API_KEY}
      WEATHER_API_BASE_URL: ${WEATHER_API_BASE_URL}
    depends_on:
      - kafka
      - orchestrator
      - ml-model
    networks:
      - blazeguard-net

  logistics-agent:
    build:
      context: ./A2A
      dockerfile: agent/logistics/Dockerfile
    container_name: blazeguard-logistics-agent
    ports:
      - "8003:8003"
    environment:
      KAFKA_BROKER: kafka:29092
      EVENT_VERSION: v1
      LOGISTICS_AGENT_URL: http://logistics-agent:8003
      ORCHESTRATOR_PORT: "8090"
      ORCHESTRATOR_GRPC_PORT: "9090"
      DATABASE_URL: ${DATABASE_URL}
      DB_SSLMODE: ${DB_SSLMODE}
      MAPBOX_API_KEY: ${MAPBOX_API_KEY}
      MAPBOX_BASE_URL: ${MAPBOX_BASE_URL}
    depends_on:
      - kafka
      - orchestrator
    networks:
      - blazeguard-net

  citizenalert-agent:
    build:
      context: ./A2A
      dockerfile: agent/citizenalert/Dockerfile
    container_name: blazeguard-citizenalert-agent
    ports:
      - "8004:8004"
    environment:
      KAFKA_BROKER: kafka:29092
      EVENT_VERSION: v1
      CITIZEN_ALERT_AGENT_URL: http://citizenalert-agent:8004
      ORCHESTRATOR_PORT: "8090"
      ORCHESTRATOR_GRPC_PORT: "9090"
    depends_on:
      - kafka
      - orchestrator
    networks:
      - blazeguard-net

  self-agent:
    build:
      context: ./A2A
      dockerfile: agent/self/Dockerfile
    container_name: blazeguard-self-agent
    ports:
      - "8005:8005"
    environment:
      KAFKA_BROKER: kafka:29092
      EVENT_VERSION: v1
      SELF_AGENT_URL: http://self-agent:8005
      ORCHESTRATOR_PORT: "8090"
      ORCHESTRATOR_GRPC_PORT: "9090"
    depends_on:
      - kafka
      - orchestrator
    networks:
      - blazeguard-net

  # ---------------------------------------------------------
  # User Interface: React Frontend
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blazeguard-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_AUTH_BASE_URL: http://localhost:2000
      VITE_ORCHESTRATOR_URL: http://localhost:8090
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    networks:
      - blazeguard-net

networks:
  blazeguard-net:
    driver: bridge
